[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-grammar"
dynamic = ["version"]
description = "Test-gated AI agent workflow documentation for HTTP APIs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "dlfelps", email = "dlfelps@gmail.com" }]
keywords = ["pytest", "ai", "agents", "llm", "api", "documentation", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pytest>=7.0",
    "starlette>=0.27",
    "httpx>=0.24",
    "jinja2>=3.1",
    "click>=8.1",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.100"]
dev = [
    "fastapi>=0.100",
    "pytest-cov",
    "mypy",
    "ruff",
]



[project.entry-points.pytest11]
agent_grammar = "agent_grammar.testing.plugin"

[project.scripts]
agent-grammar = "agent_grammar.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_grammar"]

[tool.hatch.build.targets.wheel.force-include]
"src/agent_grammar/templates" = "agent_grammar/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.version]
path = "src/agent_grammar/__init__.py"
